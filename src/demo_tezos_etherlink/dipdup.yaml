spec_version: 3.0
package: demo_tezos_etherlink

datasources:
  tzkt:
    kind: tezos.tzkt
    url: ${TZKT_URL:-https://api.shadownet.tzkt.io}

contracts:
  ticketer:
    kind: tezos
    address: KT1LdyznoJDzUqsgE8zpM242W1BBi42S8img
    typename: ticketer
  ticket_helper:
    kind: tezos
    address: KT1Ejrkzge6GoqUc7rWRT6kQKD5FYueKyjvH
    typename: ticket_helper
  rollup:
    kind: tezos
    address: sr19fMYrr5C4qqvQqQrDSjtP31GcrWjodzvg
    typename: rollup

indexes:
  rollup_operations:
    kind: tezos.operations
    datasources:
      - tzkt
    contracts:
      - ticketer
      - ticket_helper
      - rollup
    types:
      - transaction
      - sr_execute
    handlers:
      - callback: on_deposit
        pattern:
          - type: transaction
            destination: ticketer
            entrypoint: deposit
          - type: transaction
            destination: ticket_helper
            entrypoint: default
          - type: transaction
            destination: rollup
            entrypoint: default
            alias: rollup_default
      - callback: on_withdraw
        pattern:
          - type: sr_execute
            destination: rollup
          - type: transaction
            destination: ticketer
            entrypoint: withdraw
          - type: transaction
            source: ticketer
            entrypoint: transfer