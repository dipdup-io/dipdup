spec_version: 3.0
package: demo_tezos_events

datasources:
  tzkt:
    kind: tezos.tzkt
    url: https://api.shadownet.tzkt.io

contracts:
  events_contract:
    kind: tezos
    address: KT1E3EQJmoajoTj9YXJWgenuYTHnDUoWSiFt

indexes:
  events:
    kind: tezos.events
    datasources:
      - tzkt
    handlers:
      - callback: on_wrap_event
        contract: events_contract
        tag: Wrap
      - callback: on_unwrap_event
        contract: events_contract
        tag: Unwrap
      - callback: on_other_event
        contract: events_contract