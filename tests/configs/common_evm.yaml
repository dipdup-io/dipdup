datasources:
  subsquid:
    kind: evm.subsquid
    url: ${SUBSQUID_URL:-https://v2.archive.subsquid.io/network/ethereum-mainnet}
    api_key: ${SUBSQUID_API_KEY:-}
  sqd_portal:
    kind: evm.sqd_portal
    url: ${SQD_PORTAL_URL:-https://portal.sqd.dev/datasets/ethereum-mainnet}
  etherscan:
    kind: evm.etherscan
    url: ${ETHERSCAN_URL:-https://api.etherscan.io/v2/api?chainId=1}
    api_key: ${ETHERSCAN_API_KEY:-''}
  evm_node:
    kind: evm.node
    url: ${NODE_URL:-https://eth-mainnet.g.alchemy.com/v2}/${ALCHEMY_API_KEY:-''}
    ws_url: ${NODE_WS_URL:-wss://eth-mainnet.g.alchemy.com/v2}/${ALCHEMY_API_KEY:-''}